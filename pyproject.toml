[project]
name = "langchain-workshop"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kshku", email = "1211shree@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jupyter>=1.1.1",
    "langchain[mcp]>=1.4.8",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
ollama = [
    "langchain-ollama>=1.1.0",
]
openrouter = [
    "langchain-openrouter>=0.2.9",
]

[tool.setuptools]
py-modules = ["models", "settings"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
